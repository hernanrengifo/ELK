# ekl-demo — docker-compose (F0)
#
# Esta fase solo levanta la infraestructura de datos que F0/F1 necesitan:
# Neo4j (con dos bases, `negocio` e `infra`) y Redis (bus de eventos que
# usará la instrumentación de la sesión 2, F2b). Los servicios de
# aplicación (agent-a, agent-b, mcp-actions, ui) se agregan en sesiones
# posteriores — no se construyen aquí.
#
# NOTA (asunción, ver STATUS.md): Neo4j Community Edition solo soporta
# una base de datos de usuario (`neo4j`). Para tener dos bases reales
# (`negocio` e `infra`) como pide el plan, se usa la imagen Enterprise
# con la licencia de evaluación/desarrollo (gratuita para este uso).

services:
  neo4j:
    image: neo4j:5-enterprise
    container_name: ekl-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-eklpassword}"
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_config_strict__validation_enabled: "false"
    volumes:
      - ekl_neo4j_data:/data
      - ekl_neo4j_logs:/logs
      - ./data:/import
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ekl-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ekl_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ekl_neo4j_data:
  ekl_neo4j_logs:
  ekl_redis_data:
